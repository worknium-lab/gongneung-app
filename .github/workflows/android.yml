name: APK 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 앱 파일 준비
        run: |
          npm ci
          npx cap sync android

      - name: 서명 키 풀기
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/app.jks"
            echo "KS_PATH=$RUNNER_TEMP/app.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 비밀값이 없어 임시(debug) 서명으로 만듭니다. 업데이트 설치가 막힐 수 있습니다."
          fi

      - name: APK 빌드
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: gongneung
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -n "$KS_PATH" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/gongneung-1.0.${{ github.run_number }}.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/gongneung-1.0.${{ github.run_number }}.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gongneung-apk
          path: ${{ runner.temp }}/gongneung-1.0.${{ github.run_number }}.apk

      - name: 릴리스에 APK 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 공릉천교 앱 1.0.${{ github.run_number }}
          body: 폰에서 아래 APK 파일을 눌러 내려받아 설치하세요.
          files: ${{ runner.temp }}/gongneung-1.0.${{ github.run_number }}.apk
          make_latest: true
