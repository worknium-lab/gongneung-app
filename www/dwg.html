<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>공릉천교 도면</title>
<link rel="stylesheet" href="css/fonts.css">
<script>
window.EMBED = window.parent !== window;
if (window.EMBED && window.parent.claude) window.claude = window.parent.claude;
</script>
<style>
/* 도면 모듈: 목록(도면 카드) + 보기(확대·이동, S펜 메모). 밝은 현장 테마 고정 */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --sunk:#e8ecee; --line:#d3d9dd; --fg:#162027; --muted:#5b6871;
  --accent:#1d5d86; --accent-soft:#d9e7f0; --done:#2f7d4f; --work:#c26b12; --work-soft:#f8e8d4; --warn:#b3261e;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.btn{appearance:none;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{height:36px;padding:0 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.danger.arm{background:var(--warn);color:#fff}
.note{font-size:12px;color:var(--muted);margin:0}

/* ---------- 목록 ---------- */
#list{height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:1100px;margin:0 auto;padding:12px 12px 28px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.head h1{margin:0;font-size:17px;flex:1;min-width:0}
.head h1 small{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.up{display:flex;flex-direction:column;gap:6px}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{appearance:none;flex:0 0 auto;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:0 12px;font-size:13px;font-weight:600}
.chips button small{font-family:var(--f-num);color:var(--muted);font-weight:400;margin-left:4px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chips button[aria-pressed="true"] small{color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.sh{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0;overflow:hidden;display:flex;flex-direction:column;text-align:left;min-width:0}
.sh .im{aspect-ratio:1.414;background:#fff center/contain no-repeat;border-bottom:1px solid var(--line);position:relative}
.sh .im .memo{position:absolute;right:6px;top:6px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px}
.sh .t{padding:7px 9px 9px;display:flex;flex-direction:column;gap:1px;min-width:0}
.sh .t b{font-size:13px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sh .t span{font-size:11px;color:var(--muted);font-family:var(--f-num)}
.empty{color:var(--muted);font-size:14px;padding:28px 16px;text-align:center;border:1px dashed var(--line);border-radius:10px;background:var(--surface)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.set b{flex:1;min-width:0}
@media (max-width:600px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ---------- 보기 ---------- */
#viewer{position:fixed;inset:0;display:flex;flex-direction:column;background:#5d666b;z-index:5}
.vtop,.vbot{background:var(--surface);flex:none;display:flex;align-items:center;gap:6px;padding:6px 8px}
.vtop{border-bottom:1px solid var(--line)}
.vbot{border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.vbot::-webkit-scrollbar{display:none}
.vtitle{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25;cursor:pointer}
.vtitle b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtitle span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{appearance:none;flex:none;width:44px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--fg)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.ib:disabled{opacity:.35}
.sep{width:1px;height:28px;background:var(--line);flex:none;margin:0 2px}
.sw{appearance:none;flex:none;width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.wd{appearance:none;flex:none;width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.wd i{display:block;border-radius:50%;background:var(--fg)}
.wd[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
#vp{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;cursor:grab}
#vp.draw{cursor:crosshair}
#pg{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;box-shadow:0 2px 16px rgba(0,0,0,.35)}
#pg img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
#pg svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#zoomLbl{position:absolute;right:10px;bottom:10px;background:rgba(10,16,20,.6);color:#fff;font:600 12px var(--f-num);padding:3px 8px;border-radius:10px;pointer-events:none}
#loadLbl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(10,16,20,.7);color:#fff;font-size:13px;padding:8px 14px;border-radius:8px;pointer-events:none}
.vstat{font-size:11px;color:var(--muted);white-space:nowrap;margin-left:4px}

/* ---------- 도면 정보 시트 ---------- */
#info{position:fixed;inset:0;z-index:10;background:rgba(10,16,20,.4);display:flex;align-items:flex-end;justify-content:center}
#info .in{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
#info h2{margin:0;font-size:16px}
#info label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
#info input{height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg);font-size:16px;min-width:0}
#info .two{display:grid;grid-template-columns:110px 1fr;gap:8px}
#info .chips{flex-wrap:wrap}
#info .row{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
</style>
</head>
<body>

<!-- ===== 목록 ===== -->
<div id="list">
  <div class="wrap">
    <div class="card">
      <div class="head">
        <h1>도면<small id="cnt"></small></h1>
        <input type="file" id="file" accept="application/pdf,.pdf" hidden>
        <button class="btn pri" id="upBtn">PDF 올리기</button>
      </div>
      <div class="up" id="upBox" hidden><div class="note" id="upMsg"></div><div class="bar"><i id="upBar"></i></div></div>
      <p class="note" id="upHint">도면 PDF를 올리면 쪽마다 고해상도 그림으로 바꿔 저장합니다. 35쪽 기준 PC는 1~2분, 폰은 3~5분 걸립니다. 한 번 올리면 모든 기기에서 같은 도면과 메모를 봅니다.</p>
      <div class="sets" id="sets"></div>
    </div>
    <div class="chips" id="locChips" role="group" aria-label="위치로 거르기"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
    <div class="head"><p class="note" style="flex:1" id="offMsg"></p><button class="btn sm" id="offBtn">모든 도면 이 기기에 저장</button></div>
  </div>
</div>

<!-- ===== 보기 ===== -->
<div id="viewer" hidden>
  <div class="vtop">
    <button class="ib" id="vBack" aria-label="목록으로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="vtitle" id="vTitle" role="button" tabindex="0" aria-label="도면 정보 고치기"><b id="vName"></b><span id="vSub"></span></div>
    <button class="ib" id="vPrev" aria-label="이전 도면"><svg viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6"/></svg></button>
    <button class="ib" id="vNext" aria-label="다음 도면"><svg viewBox="0 0 24 24"><path d="M10 6l6 6-6 6"/></svg></button>
    <button class="ib" id="vFit" aria-label="화면에 맞추기"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="ib" id="vFull" aria-label="전체 화면" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
  </div>
  <div id="vp"><div id="pg"><img id="pgImg" alt=""><svg id="ink" xmlns="http://www.w3.org/2000/svg"></svg></div><div id="zoomLbl"></div><div id="loadLbl" hidden>도면 불러오는 중…</div></div>
  <div class="vbot" role="toolbar" aria-label="메모 도구">
    <button class="ib" data-tool="hand" aria-pressed="true" aria-label="이동"><svg viewBox="0 0 24 24"><path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12M11 11V4.5a1.5 1.5 0 0 1 3 0V11M14 11V6a1.5 1.5 0 0 1 3 0v7c0 4-2.5 7-6 7-2.6 0-4-1.4-5.3-3.3L4 14a1.5 1.5 0 0 1 2.5-1.6L8 14"/></svg></button>
    <button class="ib" data-tool="pen" aria-pressed="false" aria-label="펜"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg></button>
    <button class="ib" data-tool="hl" aria-pressed="false" aria-label="형광펜"><svg viewBox="0 0 24 24"><path d="M9 14l-3 6h5l1.5-3"/><path d="M9 14l8-9 3 3-8 9z"/></svg></button>
    <button class="ib" data-tool="eraser" aria-pressed="false" aria-label="지우개"><svg viewBox="0 0 24 24"><path d="M8 20h12M5 15l9-9 5 5-8 8H8z"/></svg></button>
    <span class="sep"></span>
    <span id="swatches" style="display:flex;gap:6px"></span>
    <span class="sep"></span>
    <span id="widths" style="display:flex;gap:4px"></span>
    <span class="sep"></span>
    <button class="ib" id="vUndo" aria-label="되돌리기"><svg viewBox="0 0 24 24"><path d="M9 7H4V2M4 7a9 9 0 1 1-1 7"/></svg></button>
    <button class="ib" id="vRedo" aria-label="다시 하기"><svg viewBox="0 0 24 24"><path d="M15 7h5V2M20 7a9 9 0 1 0 1 7"/></svg></button>
    <button class="ib" id="vShow" aria-pressed="true" aria-label="메모 보이기"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button class="ib" id="vFinger" aria-pressed="false" aria-label="손가락으로도 쓰기"><svg viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V12l3.5.7a2 2 0 0 1 1.6 2.3L16 20H9l-3-4.5a1.5 1.5 0 0 1 2.3-1.9L9 15"/></svg></button>
    <span class="vstat" id="vStat"></span>
  </div>
</div>

<!-- ===== 도면 정보 ===== -->
<div id="info" hidden>
  <div class="in" role="dialog" aria-modal="true" aria-label="도면 정보">
    <h2>도면 정보</h2>
    <div class="two">
      <label for="iNo">도면번호<input id="iNo" class="num"></label>
      <label for="iTitle">도면명<input id="iTitle"></label>
    </div>
    <div><div class="note" style="margin-bottom:6px">관련 위치 (위치로 거를 때 씁니다. 고르지 않으면 공통 도면)</div><div class="chips" id="iLocs"></div></div>
    <div class="row">
      <button class="btn pri" id="iSave" style="flex:1">저장</button>
      <button class="btn" id="iClose">닫기</button>
    </div>
    <div class="row">
      <button class="btn danger" id="iClear">이 도면 메모 모두 지우기</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let tt; const toast = m => { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3000); };
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const LOCS = ['A1', 'P1', 'P2', 'P3', 'P4', 'P5', 'P6', 'P7', 'P8', 'P9', 'P10', 'P11', 'P12', 'A2'];

/* 공릉천교 도면집(35쪽, 2026.3 경기도 건설본부) 쪽별 도면명·관련 위치 — 같은 도면집을 올리면 자동으로 채움 */
const GN_PRESET = (() => {
  const T = [['', '표지', []], ['', '간지 — 공릉천교 탄성받침 교체', []], ['', '목차', []],
    ['01', '종평면도', []], ['02', 'A1, A2 일반도 (1)', ['A1', 'A2']], ['03', 'A1, A2 일반도 (2)', ['A1', 'A2']],
    ['04', 'P1, P2 일반도 (1)', ['P1', 'P2']], ['05', 'P1, P2 일반도 (2)', ['P1', 'P2']], ['06', 'P3 일반도 (1)', ['P3']], ['07', 'P3 일반도 (2)', ['P3']],
    ['08', 'P4~P5, P7~P9, P11~12 일반도 (1)', ['P4', 'P5', 'P7', 'P8', 'P9', 'P11', 'P12']], ['09', 'P4~P5, P7~P9, P11~12 일반도 (2)', ['P4', 'P5', 'P7', 'P8', 'P9', 'P11', 'P12']],
    ['10', 'P6, P10 일반도 (1)', ['P6', 'P10']], ['11', 'P6, P10 일반도 (2)', ['P6', 'P10']],
    ['12', '보강전 받침 배치도 (1)', []], ['13', '보강전 받침 배치도 (2)', []], ['14', '보강후 받침 배치도 (1)', []], ['15', '보강후 받침 배치도 (2)', []],
    ['16', '낙교방지책 철거개요도', ['P2', 'P4', 'P8']], ['17', '교대 단면확대도', ['A1', 'A2']], ['18', '교대 단면확대 상세도 (1)', ['A1', 'A2']], ['19', '교대 단면확대 상세도 (2)', ['A1', 'A2']],
    ['20', '잭업보강재 상세도', []], ['21', '유압잭 배치 개요도 (1)', []], ['22', '유압잭 배치 개요도 (2)', []], ['23', '유압잭 배치 개요도 (3)', []], ['24', '유압잭 배치 개요도 (4)', []],
    ['25', '받침부 콘크리트 상세도 (1)', []], ['26', '받침부 콘크리트 상세도 (2)', []], ['27', '받침부 콘크리트 상세도 (3)', []],
    ['28', '받침교체순서도 (1)', []], ['29', '받침교체순서도 (2)', []], ['30', '일체형탄성받침 상세도 (1)', []], ['31', '일체형탄성받침 상세도 (2)', []], ['32', 'QRA 동시인상공법개요도', []]];
  return T.map(([no, title, locs]) => ({ no, title, locs }));
})();

let db = null, assets = null, me = null, names = {};
let SETS = {}, SHEETS = [], NOTES = {};
let LOCF = '', busy = false;

/* ---------------- 목록 ---------------- */
function sorted() { return SHEETS.slice().sort((a, b) => (a.set === b.set ? a.page - b.page : String(SETS[a.set] && SETS[a.set].at).localeCompare(String(SETS[b.set] && SETS[b.set].at)))); }
function visible() { return sorted().filter(s => !LOCF || (s.locs || []).includes(LOCF)); }
const memoN = id => { const n = NOTES[id]; return n && n.strokes ? n.strokes.length : 0; };
const THU = {};
async function thumbUrl(s) { if (!s.th || !assets) return ''; if (THU[s.th]) return THU[s.th]; const u = await assets.url(s.th); if (u) THU[s.th] = u; return u; }
function renderList() {
  $('cnt').textContent = SHEETS.length ? `${SHEETS.length}장` : '';
  const cnt = {}; SHEETS.forEach(s => (s.locs || []).forEach(l => cnt[l] = (cnt[l] || 0) + 1));
  $('locChips').hidden = !SHEETS.length;
  $('locChips').innerHTML = `<button data-loc="" aria-pressed="${!LOCF}">전체<small>${SHEETS.length}</small></button>` +
    LOCS.map(l => `<button data-loc="${l}" aria-pressed="${LOCF === l}">${l}<small>${cnt[l] || 0}</small></button>`).join('');
  const sets = Object.entries(SETS).sort((a, b) => String(a[1].at).localeCompare(String(b[1].at)));
  $('sets').innerHTML = sets.map(([id, s]) => `<div class="set"><b>${esc(s.name)} <span class="note num">${s.pages}쪽${s.done === false ? ' · 올리는 중 끊김' : ''}</span></b><button class="btn sm danger" data-delset="${id}">묶음 삭제</button></div>`).join('');
  const v = visible();
  $('empty').hidden = !!v.length;
  $('empty').textContent = SHEETS.length ? '이 위치에 연결된 도면이 없습니다.' : '아직 올린 도면이 없습니다. 위의 「PDF 올리기」로 도면 PDF를 올려 주세요.';
  $('grid').innerHTML = v.map(s => { const n = memoN(s.id);
    return `<button class="sh" data-sh="${s.id}"><span class="im" data-th="${s.id}">${n ? `<span class="memo">메모 ${n}</span>` : ''}</span><span class="t"><b>${esc(s.title || '도면')}</b><span>${s.no ? '도면 ' + esc(s.no) : 'p.' + s.page}${(s.locs || []).length ? ' · ' + esc(s.locs.join(' ')) : ''}</span></span></button>`; }).join('');
  v.forEach(async s => { const u = await thumbUrl(s); const el = document.querySelector(`[data-th="${s.id}"]`); if (el && u) el.style.backgroundImage = `url("${u}")`; });
  $('offBtn').hidden = !SHEETS.length;
}
$('locChips').addEventListener('click', e => { const b = e.target.closest('[data-loc]'); if (!b) return; LOCF = b.dataset.loc; renderList(); });
$('grid').addEventListener('click', e => { const b = e.target.closest('[data-sh]'); if (b) openSheet(b.dataset.sh); });
let armSet = null;
$('sets').addEventListener('click', async e => {
  const b = e.target.closest('[data-delset]'); if (!b) return;
  const id = b.dataset.delset;

document.addEventListener('keydown', e => {
  if ($('viewer').hidden || e.target.tagName === 'INPUT') return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); (e.shiftKey ? $('vRedo') : $('vUndo')).click(); }
  else if (e.key === 'Escape') { if (!$('info').hidden) $('info').hidden = true; else closeViewer(); }
  else if (e.key === 'ArrowLeft' && e.altKey) step(-1);
  else if (e.key === 'ArrowRight' && e.altKey) step(1);
});

/* ---------------- 연결 ---------------- */
(async () => {
  if (!window.claude || !claude.use) { $('empty').hidden = false; $('empty').textContent = '앱 안에서 열어 주세요.'; return; }
  [db, assets] = await Promise.all([claude.use('db'), claude.use('assets')]);
  const u = await claude.use('user'); if (u) { try { me = await u.id(); } catch (e) {} }
  if (!db) return;
  db.collection('dwgset').onSnapshot(s => { SETS = {}; s.docs.forEach(d => SETS[d.id] = d.data()); renderList(); });
  db.collection('dwg').onSnapshot(s => {
    SHEETS = s.docs.map(d => Object.assign({ id: d.id }, d.data()));
    if (CUR) { const n = SHEETS.find(x => x.id === CUR.id); if (n) Object.assign(CUR, n); else closeViewer(); }
    renderList();
  });
  db.collection('dwgnote').onSnapshot(s => { NOTES = {}; s.docs.forEach(d => NOTES[d.id] = d.data()); if ($('viewer').hidden) renderList(); });
  db.collection('users').onSnapshot(s => { s.docs.forEach(d => names[d.id] = (d.data() || {}).name || ''); });
  renderList();
})();
})();
